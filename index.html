#splash{position:fixed;inset:0;z-index:999;transition:opacity .45s ease;overflow:hidden;background:radial-gradient(120% 75% at 50% 32%,#1C2E4A 0%,#0E1A2B 58%,#08111E 100%);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
.in{text-align:center}
.mark{width:92px;height:92px;margin:0 auto;position:relative}
.box{position:absolute;inset:0;border-radius:26px;border:2px solid #E3A63A;opacity:0;box-shadow:0 0 0 8px rgba(227,166,58,.07),0 20px 50px rgba(0,0,0,.45)}
.c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:800;color:#E3A63A;letter-spacing:-2px;opacity:0}
.dot{position:absolute;right:16px;top:16px;width:9px;height:9px;border-radius:50%;background:#E3A63A;opacity:0}
.ring{position:absolute;right:12.5px;top:12.5px;width:16px;height:16px;border-radius:50%;border:2px solid #E3A63A;opacity:0}
.word{margin-top:26px;font-size:40px;font-weight:800;letter-spacing:.26em;padding-left:.26em}
.word span{display:inline-block;opacity:0}
.by{margin-top:6px;font-size:14px;font-weight:700;letter-spacing:.32em;color:#E3A63A;opacity:0}
.rule{width:44px;height:2px;background:#E3A63A;opacity:.5;margin:22px auto 18px;transform:scaleX(0)}
.slog{font-size:16px;color:#C9D2DE;font-weight:500;line-height:1.45;opacity:0}
.foot{position:absolute;bottom:40px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.08em;color:#6F7D90;text-transform:uppercase;opacity:0}
.go .c{animation:cIn .75s cubic-bezier(.2,.9,.3,1) .3s forwards}
.go .dot{animation:drop .5s cubic-bezier(.5,0,.75,0) 1.15s forwards,bounce .35s ease-out 1.65s}
.go .ring{animation:ring .7s ease-out 1.65s}
.go .box{animation:fade .6s ease 1.95s forwards}
.go .word span{animation:up .45s ease forwards}
.go .by{animation:up .5s ease 2.75s forwards}
.go .rule{animation:rule .5s ease 2.95s forwards}
.go .slog{animation:up .6s ease 3.1s forwards}
.go .foot{animation:fade .8s ease 3.4s forwards}
@keyframes cIn{from{opacity:0;transform:scale(.55);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes drop{from{opacity:0;transform:translateY(-120px)}10%{opacity:1}to{opacity:1;transform:none}}
@keyframes bounce{0%{transform:scale(1.5,.6)}50%{transform:translateY(-6px) scale(.9,1.1)}100%{transform:none}}
@keyframes ring{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(3.2)}}
@keyframes fade{to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rule{to{transform:none}}
#splash.out{opacity:0;pointer-events:none}
